apiVersion: apps/v1
kind: Deployment
metadata:
  name: lankaguide360-app
  namespace: lankaguide360
  labels:
    app: lankaguide360-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lankaguide360-app
  template:
    metadata:
      labels:
        app: lankaguide360-app
    spec:
      containers:
        - name: app
          image: your-registry/lankaguide360:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: lankaguide360-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lankaguide360-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: lankaguide360-secret
                  key: DB_PASS
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /index.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.php
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: lankaguide360-app
  namespace: lankaguide360
spec:
  selector:
    app: lankaguide360-app
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lankaguide360-ingress
  namespace: lankaguide360
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: lankaguide360.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lankaguide360-app
                port:
                  number: 80
